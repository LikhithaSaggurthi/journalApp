<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | JournalApp</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0;
            font-size: 14px;
        }

        .checkbox-group input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #6b7280;
        }

        .footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">📖 JournalApp</div>

        <h1>Create your account</h1>

        <p class="subtitle">
            Start your personal journaling journey.
        </p>

        <form id="signupForm">

            <div class="form-group">
                <label for="userName">Username</label>
                <input
                        type="text"
                        id="userName"
                        placeholder="Enter your username"
                        required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required>
            </div>

            <div class="checkbox-group">
                <input
                        type="checkbox"
                        id="sentimentAnalysis">

                <label for="sentimentAnalysis">
                    Enable sentiment analysis
                </label>
            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="footer">
            Already have an account?
            <a href="/login.html">Sign in</a>
        </div>

        <a class="back" href="/">
            ← Back to home
        </a>

    </div>

</div>

<script>

    document.getElementById("signupForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const user = {
            userName: document.getElementById("userName").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            sentimentAnalysis: document.getElementById("sentimentAnalysis").checked
        };

        const message = document.getElementById("message");

        try {

            const response = await fetch("/public/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(user)
            });

            if (response.ok) {

                message.textContent = "Account created successfully!";

                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 1000);

            } else {

                const errorText = await response.text();

                message.textContent =
                    errorText || "Unable to create account.";

            }

        } catch (error) {

            message.textContent =
                "Something went wrong. Please try again.";

            console.error(error);
        }

    });

</script>

</body>
</html>
